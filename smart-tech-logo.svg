    </style>
  </defs>

  <!-- Top Hexagonal Symbol with Isometric 'S' cutout -->
  <g id="hexagon-symbol">
    <!-- Upper Piece (Blue) -->
    <path d="M 500,140 
             L 620,209.3 
             L 620,285 
             L 560,250 
             L 560,305 
             L 440,235.8 
             L 380,270.4 
             L 380,209.3 
             Z" 
          fill="#2F70F2" />
          
    <!-- Lower Piece (Blue) -->
    <path d="M 620,329.6 
             L 620,390.7 
             L 500,460 
             L 380,390.7 
             L 380,315 
             L 440,350 
             L 440,295 
             L 560,364.2 
             Z" 
          fill="#2F70F2" />
  </g>

  <!-- Brand Logotype SMART TECH with curved cyan swoosh -->
  <g id="logotype">
    <!-- Letter S -->
    <path d="M 270,555 C 255,555 240,560 230,570 C 220,580 220,595 230,605 C 240,615 260,620 280,625 C 305,630 325,640 325,660 C 325,675 315,690 300,695 C 285,700 265,700 245,690 C 235,685 225,675 220,665 L 245,650 C 250,660 260,675 280,675 C 295,675 305,668 305,658 C 305,648 290,642 270,637 C 245,632 225,622 225,602 C 225,585 238,570 255,562 C 265,558 280,555 295,555 C 310,555 325,562 335,570 L 315,590 C 305,580 295,575 280,575 Z" fill="#00D2D3"/>

