    <!-- Letter T (SMART) -->
    <path d="M 630,558 L 690,558 L 690,580 L 672,580 L 672,698 L 648,698 L 648,580 L 630,580 Z" fill="#00D2D3"/>

    <!-- Letter T (TECH) -->
    <path d="M 715,558 L 775,558 L 775,580 L 757,580 L 757,698 L 733,698 L 733,580 L 715,580 Z" fill="#FFFFFF"/>

    <!-- Letter E (TECH with 3 stylized bars) -->
    <path d="M 785,558 L 845,558 L 845,580 L 810,580 L 810,618 L 840,618 L 840,638 L 810,638 L 810,676 L 845,676 L 845,698 L 785,698 Z" fill="#FFFFFF"/>

    <!-- Letter C (TECH) -->
    <path d="M 915,580 L 895,595 C 888,585 880,580 870,580 C 855,580 845,595 845,628 C 845,660 855,676 870,676 C 880,676 888,670 895,660 L 915,675 C 905,692 890,700 870,700 C 840,700 820,675 820,628 C 820,580 840,555 870,555 C 890,555 905,565 915,580 Z" fill="#FFFFFF"/>

    <!-- Letter H (TECH) -->
    <path d="M 925,558 L 948,558 L 948,615 L 980,615 L 980,558 L 1003,558 L 1003,698 L 980,698 L 980,637 L 948,637 L 948,698 L 925,698 Z" fill="#FFFFFF"/>

    <!-- Cyan Arc Swoosh under TECH -->
    <path d="M 700,520 
             C 710,640 840,735 990,620" 
          fill="none" 
          stroke="#00D2D3" 
          stroke-width="14" 
          stroke-linecap="round" />
  </g>
</svg>