<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="1000" height="750">
  <!-- Original Dark Canvas from logo-2.png -->
  <rect width="1000" height="750" fill="#171E24" rx="32" />

  <!-- Top Hexagonal Symbol with Isometric 'S' cutout -->
  <g id="hexagon-symbol" transform="translate(500, 310)">
    <!-- Upper Piece (Blue) -->
    <path d="M 0,-160 
             L 125,-88 
             L 125,-10 
             L 65,-45 
             L 65,10 
             L -60,-62 
             L -125,-25 
             L -125,-88 
             Z" 
          fill="#2F70F2" />
          
    <!-- Lower Piece (Blue) -->
    <path d="M 125,35 
             L 125,98 
             L 0,170 
             L -125,98 
             L -125,20 
             L -65,55 
             L -65,0 
             L 60,72 
             Z" 
          fill="#2F70F2" />
  </g>

  <!-- Brand Logotype SMART TECH with curved cyan swoosh -->
  <g id="logotype" transform="translate(500, 580)">
    <!-- SMART in Cyan -->
    <!-- S -->
    <path d="M -240,-25 C -255,-25 -268,-18 -275,-8 C -282,2 -282,15 -275,25 C -268,34 -252,40 -235,44 C -212,49 -198,58 -198,75 C -198,90 -208,102 -222,108 C -235,112 -252,112 -268,105 C -276,101 -284,93 -288,83 L -262,70 C -258,78 -250,88 -234,88 C -222,88 -215,82 -215,74 C -215,66 -226,60 -245,56 C -266,51 -282,42 -282,24 C -282,9 -270,-3 -256,-9 C -246,-13 -234,-15 -220,-15 C -208,-15 -195,-9 -186,-2 L -202,15 C -210,7 -218,3 -230,3 C -236,3 -242,5 -245,8 Z" fill="#00D2D3"/>

    <!-- M -->
    <path d="M -170,-22 L -148,-22 L -128,52 L -108,-22 L -86,-22 L -86,110 L -106,110 L -106,24 L -122,84 L -134,84 L -150,24 L -150,110 L -170,110 Z" fill="#00D2D3"/>

    <!-- A -->
    <path d="M -52,-22 L -30,-22 L -2,110 L -24,110 L -30,78 L -58,78 L -64,110 L -86,110 Z M -54,58 L -34,58 L -44,12 Z" fill="#00D2D3"/>

    <!-- R -->
    <path d="M 18,-22 L 58,-22 C 78,-22 92,-10 92,8 C 92,22 82,34 68,38 L 94,110 L 70,110 L 48,46 L 38,46 L 38,110 L 18,110 Z M 38,28 L 56,28 C 65,28 72,21 72,12 C 72,3 65,-4 56,-4 L 38,-4 Z" fill="#00D2D3"/>

    <!-- T (SMART) -->
    <path d="M 108,-22 L 164,-22 L 164,-2 L 146,-2 L 146,110 L 126,110 L 126,-2 L 108,-2 Z" fill="#00D2D3"/>

    <!-- Center Separator Space -->

    <!-- TECH in White -->
    <!-- T (TECH) -->
    <path d="M 195,-22 L 251,-22 L 251,-2 L 233,-2 L 233,110 L 213,110 L 213,-2 L 195,-2 Z" fill="#FFFFFF"/>

    <!-- E (TECH) with 3 horizontal stylized bars -->
    <path d="M 265,-22 L 318,-22 L 318,-2 L 287,-2 L 287,32 L 315,32 L 315,50 L 287,50 L 287,90 L 318,90 L 318,110 L 265,110 Z" fill="#FFFFFF"/>

    <!-- C (TECH) -->
    <path d="M 380,-2 L 362,12 C 356,3 348,-2 338,-2 C 324,-2 314,12 314,44 C 314,75 324,90 338,90 C 348,90 356,84 362,75 L 380,88 C 370,104 356,112 338,112 C 310,112 292,88 292,44 C 292,-2 310,-24 338,-24 C 356,-24 370,-15 380,-2 Z" fill="#FFFFFF"/>

    <!-- H (TECH) -->
    <path d="M 395,-22 L 416,-22 L 416,32 L 445,32 L 445,-22 L 466,-22 L 466,110 L 445,110 L 445,52 L 416,52 L 416,110 L 395,110 Z" fill="#FFFFFF"/>

    <!-- Curved Cyan Swoosh Arc under TECH -->
    <path d="M 180,-60 
             C 185,55 310,145 455,40" 
          fill="none" 
          stroke="#00D2D3" 
          stroke-width="12" 
          stroke-linecap="round" />
  </g>
</svg>